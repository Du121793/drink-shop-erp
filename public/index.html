<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待製作的 QR Code</title>
    <style>
      body {
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        background-color: #f4f4f9;
        color: #333;
        margin: 0;
        padding: 0;
      }
      h1 {
        text-align: center;
        color: #444;
        margin-top: 20px;
      }
      #main-container {
        max-width: 1200px;
        margin: 20px auto;
        padding: 20px;
        background: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }
      .request-group {
        margin-bottom: 30px;
        padding: 15px;
        border: 1px solid #ddd;
        border-radius: 5px;
      }
      .request-group h2 {
        font-size: 1.2em;
        color: #555;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        margin-top: 0;
      }
      .qr-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 20px;
      }
      .qr-item {
        text-align: center;
        padding: 12px;
        border: 1px solid #eee;
        border-radius: 6px;
        background-color: #fafafa;
      }
      .qr-item img {
        max-width: 100%;
        height: auto;
        display: block;
        margin-bottom: 10px;
      }
      .qr-item p {
        font-size: 0.95em;
        margin: 0 0 8px 0;
        word-break: break-all;
      }
      .qr-name {
        font-weight: 700;
        font-size: 1em;
        margin-bottom: 6px;
      }
      .qr-subtext {
        font-size: 0.82em;
        color: #555;
        margin: 0 0 6px 0;
      }
      .qr-actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .qr-actions button {
        padding: 8px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: 600;
        color: #fff;
      }
      .complete-btn {
        background-color: #28a745;
      }
      .cancel-btn {
        background-color: #d9534f;
      }
      .refund-btn {
        background-color: #f0ad4e;
      }
      #error-log {
        color: #d8000c;
        background-color: #ffbaba;
        border: 1px solid #d8000c;
        padding: 10px;
        margin: 10px auto;
        max-width: 1200px;
        border-radius: 5px;
      }
      #loading {
        text-align: center;
        font-size: 1.5em;
        padding: 20px;
      }
      .empty-placeholder {
        text-align: center;
        color: #777;
        padding: 20px 0;
      }
    </style>
  </head>
  <body>
    <h1>待製作的 QR Code</h1>
    <div id="main-container">
      <div id="loading">載入中...</div>
      <div id="requests-container"></div>
    </div>
    <div id="error-log" style="display: none"></div>

    <script>
      const requestsContainer = document.getElementById("requests-container");
      const errorLog = document.getElementById("error-log");
      const loadingDiv = document.getElementById("loading");
      const QR_CACHE_TTL_MS = 45 * 60 * 1000;

      function showError(message) {
        errorLog.textContent = `錯誤：${message}`;
        errorLog.style.display = "block";
      }

      function clearError() {
        errorLog.style.display = "none";
        errorLog.textContent = "";
      }

      async function updateOrderStatus(
        detailId,
        status,
        requestUUID,
        refund = false
      ) {
        try {
          const response = await fetch(`/api/order/${detailId}`, {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              status,
              requestUUID,
              refund,
            }),
          });

          const payload = response.ok ? await response.json() : await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(
              payload.msg ||
                `更新訂單狀態失敗（代碼：${response.status}）`
            );
          }

          clearError();
          fetchAndDisplayQRCodes();
        } catch (error) {
          console.error("更新訂單狀態失敗", error);
          showError(error.message);
        }
      }

      async function reorderOrder(detailId, requestUUID) {
        try {
          const response = await fetch("/api/order/reorder", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ detailId, requestUUID }),
          });

          const payload = response.ok ? await response.json() : await response.json().catch(() => ({}));
          if (!response.ok) {
            throw new Error(
              payload.msg ||
                `重新下單失敗（代碼：${response.status}）`
            );
          }

          clearError();
          fetchAndDisplayQRCodes();
          return true;
        } catch (error) {
          console.error("重新下單失敗", error);
          showError(error.message);
          alert(error.message);
          return false;
        }
      }

      async function handleCancel(detailId, requestUUID, refund = false) {
        const wantReorder = window.confirm("是否重新為此 UUID 下單？");

        if (wantReorder) {
          const reordered = await reorderOrder(detailId, requestUUID);
          if (reordered) {
            return;
          }
        }

        await updateOrderStatus(detailId, false, requestUUID, refund);
      }

      function computeExpiresAt(request, item) {
        const expires =
          item.expiresAt ||
          request.expiresAt ||
          (request.createdAt
            ? new Date(new Date(request.createdAt).getTime() + QR_CACHE_TTL_MS).toISOString()
            : null);
        return expires;
      }

      function formatRemainingTime(expiresAt) {
        if (!expiresAt) return "剩餘時間：未知";
        const ts = Date.parse(expiresAt);
        if (!Number.isFinite(ts)) return "剩餘時間：未知";
        const diff = ts - Date.now();
        if (diff <= 0) return "剩餘時間：已逾期";
        const minutes = Math.floor(diff / 60000);
        const seconds = Math.floor((diff % 60000) / 1000);
        if (minutes >= 60) {
          const hours = Math.floor(minutes / 60);
          const mins = minutes % 60;
          return `剩餘時間：${hours} 小時 ${mins} 分`;
        }
        return `剩餘時間：${minutes} 分 ${seconds.toString().padStart(2, "0")} 秒`;
      }

      async function fetchAndDisplayQRCodes() {
        try {
          const response = await fetch("/api/order/cache");
          if (!response.ok) {
            throw new Error(`HTTP 錯誤，代碼：${response.status}`);
          }
          const requests = await response.json();

          loadingDiv.style.display = "none";
          requestsContainer.innerHTML = "";

          if (requests.length === 0) {
            requestsContainer.innerHTML =
              '<div class="empty-placeholder">目前沒有待製作的訂單</div>';
          }

          for (const request of requests) {
            const requestDiv = document.createElement("div");
            requestDiv.className = "request-group";

            const title = document.createElement("h2");
            title.textContent = `訂單請求 UUID：${request.requestUUID}`;
            requestDiv.appendChild(title);

            const qrGrid = document.createElement("div");
            qrGrid.className = "qr-grid";

            for (const item of request.qrcodes) {
              const qrItemDiv = document.createElement("div");
              qrItemDiv.className = "qr-item";

              const img = document.createElement("img");
              img.src = item.qrcode;
              img.alt = `QR Code for detailId ${item.detailId}`;

              const nameText = document.createElement("p");
              nameText.className = "qr-name";
              nameText.textContent =
                item.productName ||
                (item.productId ? `品項 #${item.productId}` : `明細 #${item.detailId}`);

              const detailText = document.createElement("p");
              detailText.className = "qr-subtext";
              detailText.textContent = `明細 ID：${item.detailId}`;

              const expiresAt = computeExpiresAt(request, item);
              const remainText = document.createElement("p");
              remainText.className = "qr-subtext";
              remainText.textContent = formatRemainingTime(expiresAt);

              const actionsDiv = document.createElement("div");
              actionsDiv.className = "qr-actions";

              const completeButton = document.createElement("button");
              completeButton.className = "complete-btn";
              completeButton.textContent = "完成";
              completeButton.onclick = () =>
                updateOrderStatus(item.detailId, true, request.requestUUID);

              const cancelButton = document.createElement("button");
              cancelButton.className = "cancel-btn";
              cancelButton.textContent = "取消（不退原料，預設）";
              cancelButton.onclick = () =>
                handleCancel(item.detailId, request.requestUUID, false);

              const refundButton = document.createElement("button");
              refundButton.className = "refund-btn";
              refundButton.textContent = "取消並退還原料";
              refundButton.onclick = () =>
                handleCancel(item.detailId, request.requestUUID, true);

              actionsDiv.appendChild(completeButton);
              actionsDiv.appendChild(cancelButton);
              actionsDiv.appendChild(refundButton);

              qrItemDiv.appendChild(img);
              qrItemDiv.appendChild(nameText);
              qrItemDiv.appendChild(detailText);
              qrItemDiv.appendChild(remainText);
              qrItemDiv.appendChild(actionsDiv);
              qrGrid.appendChild(qrItemDiv);
            }
            requestDiv.appendChild(qrGrid);
            requestsContainer.appendChild(requestDiv);
          }

          clearError();
        } catch (error) {
          console.error("讀取 QR Code 失敗", error);
          showError(error.message);
          loadingDiv.style.display = "none";
        }
      }

      fetchAndDisplayQRCodes();
      setInterval(fetchAndDisplayQRCodes, 1000);
    </script>
  </body>
</html>
